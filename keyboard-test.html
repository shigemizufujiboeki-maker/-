<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iPad入力診断</title><style>body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:24px;background:#f4f7fa;color:#143247}main{max-width:750px;margin:auto}h1{font-size:23px}label{font-weight:700;display:block;margin:20px 0 8px}input,textarea{display:block;width:100%;font:20px system-ui;border:2px solid #9dbdcb;border-radius:12px;padding:16px;background:white;box-sizing:border-box}textarea{min-height:110px}button{font:17px system-ui;border:0;border-radius:12px;padding:15px;margin:12px 8px 8px 0;background:#135879;color:white}#log{white-space:pre-wrap;background:white;border-radius:12px;padding:16px;min-height:100px;overflow-wrap:anywhere}.note{font-size:14px;line-height:1.6;color:#526979}</style></head><body><main><h1>iPadキーボード入力診断</h1><p>2026-10-22 テスト版。入力内容は送信・保存しません。</p><label for="t">① この欄を指でタップして文字を入力</label><input id="t" type="text" autocomplete="off" placeholder="ここに「ABC123」と入力"><label for="n">② 数字欄を指でタップ</label><input id="n" type="number" inputmode="decimal" placeholder="123"><label for="m">③ 長文入力をテスト</label><textarea id="m" placeholder="ここに日本語を入力"></textarea><div><button id="focus" type="button">①へフォーカス</button><button id="clear" type="button">欄を消去</button></div><h2>診断結果</h2><div id="log">操作待ち</div><p class="note">「キーボードが出ない」ときは、Bluetoothキーボードが接続されていないか、設定の「一般→キーボード」を確認してください。診断が終わったらスクリーンショットを送ってください。</p></main><script>const $=id=>document.getElementById(id),log=$('log');let steps=[];function write(a){steps.unshift(new Date().toLocaleTimeString('ja-JP')+' '+a);log.textContent=steps.slice(0,12).join('\n')}for(const id of ['t','n','m']){const e=$(id);e.addEventListener('focus',()=>write(id+' focus: 入力欄が選択された'));e.addEventListener('input',()=>write(id+' 入力検知（文字数 '+e.value.length+'）'));e.addEventListener('keydown',e=>write(id+' キー入力 '+e.key));e.addEventListener('touchstart',()=>write(id+' タッチ検知'),{passive:true})}$('focus').onclick=()=>{$('t').focus();write('フォーカスボタンを押した')};$('clear').onclick=()=>{for(const id of ['t','n','m'])$(id).value='';write('消去しました')};if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>write('表示領域高さ '+Math.round(window.visualViewport.height)));write('診断ページを開きました');</script></body></html>
